[project]
name = "metjou-backend"
version = "0.1.0"
description = "Backend for the MetJou safety app: the 'Wat moet ik doen?' assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "fastembed>=0.7",
    "httpx>=0.28",
    "trafilatura>=2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres with pgvector (DATABASE_URL)"]
