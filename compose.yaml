services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: metjou
      POSTGRES_PASSWORD: metjou
      POSTGRES_DB: metjou
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metjou"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
